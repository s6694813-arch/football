<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>NFL Football - Retro Style</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #0d1b2a; font-family: "Courier New", monospace;
    color: #fff; user-select: none; -webkit-user-select: none;
    touch-action: manipulation;
  }
  canvas, #controls, #joystickZone { touch-action: none; }
  #gameContainer {
    position: relative; width: 100%; height: 100%;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  canvas {
    display: block; max-width: 100%; max-height: 100%;
    image-rendering: pixelated; image-rendering: crisp-edges;
    border: 3px solid #1a1a2e;
  }
  #controls {
    position: absolute; bottom: 0; left: 0; right: 0;
    height: 155px; pointer-events: none; display: none; z-index: 20;
  }
  #controls.active { display: block; }
  .btn {
    position: absolute; pointer-events: auto;
    border: 3px solid #fff; border-radius: 8px;
    font-weight: bold; color: #fff; font-size: 13px;
    font-family: "Courier New", monospace;
    background: #1a1a2e; box-shadow: 3px 3px 0 #000;
    display: flex; align-items: center; justify-content: center;
  }
  .btn:active, .btn.pressed { transform: translate(2px, 2px); box-shadow: 1px 1px 0 #000; }
  #joystickZone {
    position: absolute; left: 10px; bottom: 18px;
    width: 115px; height: 115px; pointer-events: auto;
  }
  #joystickBase {
    width: 105px; height: 105px; border-radius: 50%;
    background: rgba(26,26,46,0.85); border: 3px solid #fff;
    position: relative; box-shadow: 3px 3px 0 #000;
  }
  #joystickKnob {
    width: 44px; height: 44px; border-radius: 50%;
    background: #e94560; border: 2px solid #fff;
    position: absolute; top: 28px; left: 28px;
  }
  #btnSnap {
    right: 16px; bottom: 85px; width: 72px; height: 58px;
    background: #0f9d58; font-size: 14px;
  }
  #btnThrow {
    right: 16px; bottom: 14px; width: 78px; height: 62px;
    background: #e94560; font-size: 15px;
  }
  #btnHandoff {
    right: 100px; bottom: 14px; width: 62px; height: 48px;
    background: #3d5a80; font-size: 11px;
  }
  .recvBtn {
    width: 42px; height: 42px; font-size: 16px;
    background: #1a1a2e;
  }
  #recv1 { right: 175px; bottom: 95px; }
  #recv2 { right: 128px; bottom: 95px; }
  #recv3 { right: 81px; bottom: 95px; }
  #recv4 { right: 34px; bottom: 95px; }
  .recvBtn.selected { background: #ffd700; color: #000; border-color: #000; }

  .overlay {
    position: absolute; inset: 0; background: #0d1b2a;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
    z-index: 30; padding: 16px; padding-top: 24px;
    overflow-y: auto; -webkit-overflow-scrolling: touch;
    touch-action: pan-y;
  }
  .overlay.hidden { display: none; }
  h1 { font-size: clamp(26px, 7vw, 40px); color: #ffd700; margin-bottom: 6px; text-align: center; letter-spacing: 2px; }
  h2 { font-size: clamp(18px, 4.5vw, 26px); margin-bottom: 10px; text-align: center; color: #e94560; flex-shrink: 0; }
  .subtitle { color: #8892a0; margin-bottom: 16px; text-align: center; font-size: 14px; }
  .team-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
    gap: 8px; width: 100%; max-width: 580px;
    overflow-y: visible; padding: 6px 6px 80px 6px;
    touch-action: pan-y;
  }
  .team-card {
    padding: 14px 8px; border-radius: 6px; text-align: center;
    font-weight: bold; font-size: 13px; cursor: pointer;
    border: 3px solid transparent; box-shadow: 2px 2px 0 #000;
    min-height: 56px; touch-action: manipulation;
    -webkit-user-select: none; user-select: none;
  }
  .team-card:active { transform: translate(1px,1px); opacity: 0.9; }
  .team-card.selected { border-color: #ffd700; box-shadow: 0 0 0 2px #ffd700, 2px 2px 0 #000; }
  .team-card .abbr { font-size: 18px; display: block; pointer-events: none; }
  .team-card .name { font-size: 10px; opacity: 0.85; font-weight: normal; pointer-events: none; }
  .primary-btn {
    margin-top: 18px; padding: 12px 36px; font-size: 16px; font-weight: bold;
    background: #0f9d58; color: #fff; border: 3px solid #fff;
    border-radius: 8px; cursor: pointer; min-width: 160px;
    font-family: "Courier New", monospace; box-shadow: 3px 3px 0 #000;
  }
  .primary-btn:active { transform: translate(2px,2px); box-shadow: 1px 1px 0 #000; }
  .score-bar {
    position: absolute; top: 0; left: 0; right: 0; height: 48px;
    background: #1a1a2e; border-bottom: 3px solid #fff;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 10px; z-index: 15; font-size: 13px; pointer-events: none;
  }
  .score-bar .score { font-size: 20px; font-weight: bold; color: #ffd700; }
  .message {
    position: absolute; top: 45%; left: 50%; transform: translate(-50%, -50%);
    background: #1a1a2e; padding: 14px 24px; border: 3px solid #ffd700;
    border-radius: 8px; font-size: 20px; font-weight: bold; color: #ffd700;
    z-index: 25; pointer-events: none; text-align: center; max-width: 88%;
    box-shadow: 4px 4px 0 #000;
  }
  .message.hidden { display: none; }
  .hint {
    position: absolute; bottom: 165px; left: 0; right: 0; text-align: center;
    font-size: 12px; color: rgba(255,255,255,0.65); z-index: 15; pointer-events: none;
  }
  @media (orientation: landscape) and (max-height: 500px) {
    #controls { height: 120px; }
    #joystickZone { width: 85px; height: 85px; bottom: 8px; }
    #joystickBase { width: 78px; height: 78px; }
    #joystickKnob { width: 34px; height: 34px; top: 20px; left: 20px; }
    #btnSnap { width: 52px; height: 46px; bottom: 62px; right: 12px; font-size: 11px; }
    #btnThrow { width: 58px; height: 48px; bottom: 10px; right: 12px; font-size: 12px; }
    #btnHandoff { width: 48px; height: 38px; bottom: 10px; right: 78px; font-size: 10px; }
    .recvBtn { width: 34px; height: 34px; font-size: 13px; }
    #recv1 { right: 145px; bottom: 70px; }
    #recv2 { right: 106px; bottom: 70px; }
    #recv3 { right: 67px; bottom: 70px; }
    #recv4 { right: 28px; bottom: 70px; }
    .score-bar { height: 36px; font-size: 11px; }
    .score-bar .score { font-size: 15px; }
    .hint { bottom: 128px; font-size: 10px; }
  }
</style>
</head>
<body>
<div id="gameContainer">
  <canvas id="gameCanvas"></canvas>

  <div class="score-bar" id="scoreBar" style="display:none;">
    <div>
      <span id="downText">1st & 10</span><br>
      <span id="possText" style="font-size:11px;color:#ffd700;">YOUR BALL</span>
    </div>
    <div class="score" id="scoreText">0 - 0</div>
    <div style="text-align:right;">
      <span id="clockText">Q1 5:00</span>
    </div>
  </div>

  <div class="message hidden" id="messageBox"></div>
  <div class="hint" id="hintText" style="display:none;"></div>

  <div id="controls">
    <div id="joystickZone">
      <div id="joystickBase"><div id="joystickKnob"></div></div>
    </div>
    <button class="btn recvBtn" id="recv1">1</button>
    <button class="btn recvBtn" id="recv2">2</button>
    <button class="btn recvBtn" id="recv3">3</button>
    <button class="btn recvBtn" id="recv4">4</button>
    <button class="btn" id="btnHandoff">HAND<br>OFF</button>
    <button class="btn" id="btnSnap">SNAP</button>
    <button class="btn" id="btnThrow">THROW</button>
  </div>

  <div class="overlay" id="menuOverlay" style="justify-content:center;">
    <h1>NFL FOOTBALL</h1>
    <p class="subtitle">RETRO STYLE · PASS & PLAY</p>
    <button class="primary-btn" id="btnStart">SELECT TEAM</button>
    <div style="margin-top:24px; color:#667; font-size:12px; text-align:center; max-width:300px; line-height:1.5;">
      Joystick to move · 1-4 pick receiver<br>THROW to pass · HANDOFF to run
    </div>
  </div>

  <div class="overlay hidden" id="teamOverlay">
    <h2>SELECT YOUR TEAM</h2>
    <p style="color:#8892a0; font-size:12px; margin-bottom:12px; text-align:center;">Tap a team, then press START GAME</p>
    <div class="team-grid" id="teamGrid"></div>
    <button class="primary-btn" id="btnConfirmTeam" style="display:none; position:sticky; bottom:16px; z-index:5;">START GAME</button>
  </div>

  <div class="overlay hidden" id="resultOverlay">
    <h2 id="resultTitle">Play Result</h2>
    <p id="resultText" style="font-size:16px; margin:10px 0; color:#aaa;"></p>
    <button class="primary-btn" id="btnContinue">CONTINUE</button>
  </div>

  <div class="overlay hidden" id="gameOverOverlay">
    <h1>GAME OVER</h1>
    <h2 id="finalResult" style="color:#ffd700;"></h2>
    <p id="finalScore" style="font-size:20px; margin:14px 0;"></p>
    <button class="primary-btn" id="btnMenu">MAIN MENU</button>
  </div>
</div>

<script>
const NFL_TEAMS = [
  {name:"Arizona Cardinals", abbr:"ARI", color:"#97263f", dark:"#5c1526"},
  {name:"Atlanta Falcons", abbr:"ATL", color:"#a71930", dark:"#6b1020"},
  {name:"Baltimore Ravens", abbr:"BAL", color:"#241773", dark:"#15104a"},
  {name:"Buffalo Bills", abbr:"BUF", color:"#00338d", dark:"#001f56"},
  {name:"Carolina Panthers", abbr:"CAR", color:"#0085ca", dark:"#005580"},
  {name:"Chicago Bears", abbr:"CHI", color:"#0b162a", dark:"#050b15"},
  {name:"Cincinnati Bengals", abbr:"CIN", color:"#fb4f14", dark:"#a3330d"},
  {name:"Cleveland Browns", abbr:"CLE", color:"#311d00", dark:"#1a0f00"},
  {name:"Dallas Cowboys", abbr:"DAL", color:"#002244", dark:"#001122"},
  {name:"Denver Broncos", abbr:"DEN", color:"#fb4f14", dark:"#a3330d"},
  {name:"Detroit Lions", abbr:"DET", color:"#0076b6", dark:"#004a73"},
  {name:"Green Bay Packers", abbr:"GB", color:"#203731", dark:"#10201c"},
  {name:"Houston Texans", abbr:"HOU", color:"#03202f", dark:"#011018"},
  {name:"Indianapolis Colts", abbr:"IND", color:"#002c5f", dark:"#001830"},
  {name:"Jacksonville Jaguars", abbr:"JAX", color:"#006778", dark:"#003d48"},
  {name:"Kansas City Chiefs", abbr:"KC", color:"#e31837", dark:"#8c0f22"},
  {name:"Las Vegas Raiders", abbr:"LV", color:"#000000", dark:"#111"},
  {name:"Los Angeles Chargers", abbr:"LAC", color:"#0080c6", dark:"#005080"},
  {name:"Los Angeles Rams", abbr:"LAR", color:"#003594", dark:"#001f58"},
  {name:"Miami Dolphins", abbr:"MIA", color:"#008e97", dark:"#005a60"},
  {name:"Minnesota Vikings", abbr:"MIN", color:"#4f2683", dark:"#2f164f"},
  {name:"New England Patriots", abbr:"NE", color:"#002244", dark:"#001122"},
  {name:"New Orleans Saints", abbr:"NO", color:"#d3bc8d", dark:"#8a7a5a"},
  {name:"New York Giants", abbr:"NYG", color:"#0b2340", dark:"#061220"},
  {name:"New York Jets", abbr:"NYJ", color:"#125740", dark:"#0a3024"},
  {name:"Philadelphia Eagles", abbr:"PHI", color:"#004c54", dark:"#002c30"},
  {name:"Pittsburgh Steelers", abbr:"PIT", color:"#ffb612", dark:"#a0750c"},
  {name:"San Francisco 49ers", abbr:"SF", color:"#aa0000", dark:"#6b0000"},
  {name:"Seattle Seahawks", abbr:"SEA", color:"#002244", dark:"#001122"},
  {name:"Tampa Bay Buccaneers", abbr:"TB", color:"#d50a0a", dark:"#8a0606"},
  {name:"Tennessee Titans", abbr:"TEN", color:"#0c2340", dark:"#061220"},
  {name:"Washington Commanders", abbr:"WAS", color:"#5a1414", dark:"#350c0c"},
];

const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");
let W = 800, H = 450;

function resize() {
  const isLandscape = window.innerWidth > window.innerHeight;
  const maxW = window.innerWidth;
  const maxH = window.innerHeight;
  let targetW = maxW, targetH = maxW * 0.56;
  if (targetH > maxH) { targetH = maxH; targetW = maxH / 0.56; }
  if (!isLandscape && maxH > maxW) {
    targetW = maxW;
    targetH = Math.min(maxH * 0.70, maxW * 0.68);
  }
  canvas.width = W = Math.floor(targetW);
  canvas.height = H = Math.floor(targetH);
  canvas.style.width = targetW + "px";
  canvas.style.height = targetH + "px";
}
window.addEventListener("resize", resize);
window.addEventListener("orientationchange", () => setTimeout(resize, 120));
resize();

const State = { MENU:0, TEAM:1, PLAY:2, RESULT:3, OVER:4 };
let state = State.MENU;
let playerTeam = null, botTeam = null, selectedTeamIdx = -1;
let scoreP = 0, scoreB = 0, quarter = 1, clock = 5 * 60;
let down = 1, toGo = 10, los = 160, firstDownX = 240;
let possession = "player", playActive = false;
let message = "", messageTimer = 0, selectedRecv = 0;
let qb = null, receivers = [], runners = [], defense = [], ball = null;
let joyActive = false, joyDX = 0, joyDY = 0;
let joyOrigin = {x:0, y:0};
let botTimer = 0;

class Player {
  constructor(x, y, color, dark, offense, role) {
    this.x = x; this.y = y;
    this.color = color; this.dark = dark;
    this.offense = offense; this.role = role;
    this.r = Math.max(11, Math.min(15, W * 0.017));
    this.speed = offense ? 1.55 : 1.35;
    this.hasBall = false;
    this.tx = x; this.ty = y;
    this.route = []; this.ri = 0;
    this.stunned = 0; this.cd = 0;
    this.facing = 1;
  }
  update() {
    if (this.stunned > 0) { this.stunned--; return; }
    const dx = this.tx - this.x, dy = this.ty - this.y;
    const d = Math.hypot(dx, dy);
    if (d > 1.5) {
      this.x += (dx / d) * this.speed;
      this.y += (dy / d) * this.speed;
      if (Math.abs(dx) > 0.5) this.facing = dx > 0 ? 1 : -1;
    } else if (this.route.length && this.ri < this.route.length) {
      this.tx = this.route[this.ri].x;
      this.ty = this.route[this.ri].y;
      this.ri++;
    }
    this.x = Math.max(28, Math.min(W - 28, this.x));
    this.y = Math.max(52, Math.min(H - 52, this.y));
    if (this.cd > 0) this.cd--;
  }
  draw() {
    const r = this.r;
    const x = Math.round(this.x), y = Math.round(this.y);

    // Shadow
    ctx.fillStyle = "rgba(0,0,0,0.25)";
    ctx.beginPath();
    ctx.ellipse(x, y + r * 0.7, r * 0.9, r * 0.35, 0, 0, Math.PI * 2);
    ctx.fill();

    // Legs
    ctx.fillStyle = this.dark;
    ctx.fillRect(x - 5, y + 2, 4, 9);
    ctx.fillRect(x + 1, y + 2, 4, 9);

    // Body (jersey)
    ctx.fillStyle = this.stunned > 0 ? "#777" : this.color;
    ctx.fillRect(x - 7, y - 8, 14, 14);
    ctx.fillStyle = "rgba(255,255,255,0.15)";
    ctx.fillRect(x - 7, y - 8, 14, 3);

    // Helmet
    ctx.fillStyle = this.stunned > 0 ? "#999" : this.color;
    ctx.beginPath();
    ctx.arc(x, y - 12, 8, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "rgba(255,255,255,0.25)";
    ctx.beginPath();
    ctx.arc(x - 2, y - 14, 3, 0, Math.PI * 2);
    ctx.fill();
    // Facemask
    ctx.strokeStyle = "#ccc";
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(x + 5 * this.facing, y - 14);
    ctx.lineTo(x + 9 * this.facing, y - 11);
    ctx.lineTo(x + 9 * this.facing, y - 8);
    ctx.stroke();

    let label = this.role === "QB" ? "Q" : this.role === "RB" ? "R" : (this.role === "WR" || this.role === "TE") ? "W" : "";
    if (label) {
      ctx.fillStyle = "#fff";
      ctx.font = `bold ${Math.max(9, r - 2)}px Courier New`;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(label, x, y - 1);
    }

    if (this.hasBall) {
      ctx.fillStyle = "#c45c00";
      ctx.beginPath();
      ctx.ellipse(x + 10 * this.facing, y - 2, 6, 4, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = "#5a2a00";
      ctx.lineWidth = 1;
      ctx.stroke();
    }
  }
}

class Ball {
  constructor() {
    this.x = 0; this.y = 0; this.vx = 0; this.vy = 0;
    this.inAir = false; this.carrier = null;
  }
  throwTo(sx, sy, tx, ty, power = 5.5) {
    this.x = sx; this.y = sy;
    const dx = tx - sx, dy = ty - sy;
    const d = Math.max(1, Math.hypot(dx, dy));
    this.vx = (dx / d) * power;
    this.vy = (dy / d) * power * 0.85;
    this.inAir = true; this.carrier = null;
  }
  update() {
    if (this.inAir) {
      this.x += this.vx; this.y += this.vy;
      this.vy += 0.04;
      this.vx *= 0.997;
      if (this.x < 18 || this.x > W - 18 || this.y < 38 || this.y > H - 38 ||
          (Math.abs(this.vx) < 0.25 && Math.abs(this.vy) < 0.25)) {
        this.inAir = false;
        return "incomplete";
      }
    } else if (this.carrier) {
      this.x = this.carrier.x + 10 * this.carrier.facing;
      this.y = this.carrier.y - 2;
    }
    return null;
  }
  draw() {
    if (this.inAir || this.carrier) {
      const x = Math.round(this.x), y = Math.round(this.y);
      ctx.fillStyle = "#c45c00";
      ctx.beginPath();
      ctx.ellipse(x, y, 7, 4.5, this.inAir ? 0.3 : 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = "#5a2a00";
      ctx.lineWidth = 1;
      ctx.stroke();
      if (this.inAir) {
        ctx.strokeStyle = "#fff";
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(x - 3, y); ctx.lineTo(x + 3, y);
        ctx.stroke();
      }
    }
  }
}

function setupPlay() {
  playActive = false;
  ball = new Ball();
  receivers = []; runners = []; defense = [];
  selectedRecv = 0;
  updateRecvButtons();
  botTimer = 0;

  const offC = possession === "player" ? playerTeam.color : botTeam.color;
  const offD = possession === "player" ? playerTeam.dark : botTeam.dark;
  const defC = possession === "player" ? botTeam.color : playerTeam.color;
  const defD = possession === "player" ? botTeam.dark : playerTeam.dark;

  qb = new Player(los - 30, H / 2, offC, offD, true, "QB");
  qb.hasBall = true;
  ball.carrier = qb;

  const rb = new Player(los - 55, H / 2 + 30, offC, offD, true, "RB");
  runners.push(rb);

  const wrPos = [
    {x: los + 20, y: H / 2 - 100},
    {x: los + 12, y: H / 2 - 48},
    {x: los + 12, y: H / 2 + 48},
    {x: los + 20, y: H / 2 + 100},
  ];
  const routes = [
    [{x: los + 110, y: H/2 - 115}, {x: los + 200, y: H/2 - 80}],
    [{x: los + 75, y: H/2 - 25}, {x: los + 140, y: H/2 - 15}],
    [{x: los + 70, y: H/2 + 25}, {x: los + 135, y: H/2 + 40}],
    [{x: los + 60, y: H/2 + 85}, {x: los + 125, y: H/2 + 70}],
  ];
  wrPos.forEach((p, i) => {
    const wr = new Player(p.x, p.y, offC, offD, true, i === 3 ? "TE" : "WR");
    wr.route = routes[i];
    wr.tx = routes[i][0].x; wr.ty = routes[i][0].y; wr.ri = 1;
    wr.speed = 1.45;
    receivers.push(wr);
  });

  const defPos = [
    {x: los + 35, y: H/2 - 70}, {x: los + 35, y: H/2 - 22},
    {x: los + 35, y: H/2 + 22}, {x: los + 35, y: H/2 + 70},
    {x: los + 80, y: H/2 - 90}, {x: los + 80, y: H/2},
    {x: los + 80, y: H/2 + 90}, {x: los + 130, y: H/2 - 45},
    {x: los + 130, y: H/2 + 45}, {x: los + 175, y: H/2},
  ];
  defPos.forEach((p, i) => {
    const d = new Player(p.x, p.y, defC, defD, false, "D");
    d.speed = 1.2 + Math.random() * 0.35;
    defense.push(d);
  });

  showMessage(`${down}${["st","nd","rd","th"][down-1] || "th"} & ${toGo}`);
}

function startGame(pIdx) {
  playerTeam = NFL_TEAMS[pIdx];
  let bIdx;
  do { bIdx = Math.floor(Math.random() * 32); } while (bIdx === pIdx);
  botTeam = NFL_TEAMS[bIdx];
  scoreP = 0; scoreB = 0; quarter = 1; clock = 5 * 60;
  down = 1; toGo = 10; los = 160; firstDownX = 240;
  possession = "player";
  state = State.PLAY;
  document.getElementById("menuOverlay").classList.add("hidden");
  document.getElementById("teamOverlay").classList.add("hidden");
  document.getElementById("scoreBar").style.display = "flex";
  document.getElementById("controls").classList.add("active");
  setupPlay();
  updateHUD();
}

function snap() {
  if (!playActive && possession === "player") {
    playActive = true;
    receivers.forEach(wr => {
      if (wr.route.length) { wr.tx = wr.route[0].x; wr.ty = wr.route[0].y; wr.ri = 1; }
    });
  }
}

function endPlay(text, yards = 0) {
  playActive = false;
  document.getElementById("resultTitle").textContent = text;
  document.getElementById("resultText").textContent = yards ? `${yards} yards` : "";
  document.getElementById("resultOverlay").classList.remove("hidden");
  state = State.RESULT;

  if (yards >= toGo) {
    down = 1; toGo = 10;
    los += yards * 5.5;
    firstDownX = los + 70;
    showMessage("FIRST DOWN!");
  } else {
    down++;
    toGo -= yards;
    los += yards * 5.5;
    if (down > 4) {
      showMessage("TURNOVER ON DOWNS");
      switchPoss();
      return;
    }
  }
  los = Math.max(90, Math.min(W - 140, los));
  firstDownX = los + toGo * 5.5;
}

function scoreTD() {
  playActive = false;
  if (possession === "player") {
    scoreP += 7;
    document.getElementById("resultTitle").textContent = "TOUCHDOWN!";
    document.getElementById("resultText").textContent = "+7 POINTS";
  } else {
    scoreB += 7;
    document.getElementById("resultTitle").textContent = "BOT TOUCHDOWN";
    document.getElementById("resultText").textContent = "+7 POINTS";
  }
  document.getElementById("resultOverlay").classList.remove("hidden");
  state = State.RESULT;
  switchPoss();
  los = 160; firstDownX = 240; down = 1; toGo = 10;
  updateHUD();
}

function switchPoss() {
  possession = possession === "player" ? "bot" : "player";
  down = 1; toGo = 10; los = 160; firstDownX = 240;
}

function showMessage(msg) {
  message = msg; messageTimer = 100;
  const el = document.getElementById("messageBox");
  el.textContent = msg;
  el.classList.remove("hidden");
}

function updateHUD() {
  document.getElementById("scoreText").textContent = `${scoreP} - ${scoreB}`;
  document.getElementById("downText").textContent = `${down}${["st","nd","rd","th"][down-1]||"th"} & ${toGo}`;
  document.getElementById("possText").textContent = possession === "player" ? "YOUR BALL" : "BOT BALL";
  document.getElementById("possText").style.color = possession === "player" ? "#ffd700" : "#e94560";
  const m = Math.floor(clock / 60), s = Math.floor(clock % 60);
  document.getElementById("clockText").textContent = `Q${quarter} ${m}:${s.toString().padStart(2,"0")}`;
  const hint = document.getElementById("hintText");
  if (possession === "player" && !playActive) {
    hint.style.display = "block";
    hint.textContent = "Tap SNAP to hike the ball";
  } else if (possession === "player" && playActive) {
    hint.style.display = "block";
    hint.textContent = "Move · Pick 1-4 · THROW or HANDOFF";
  } else {
    hint.style.display = "none";
  }
}

function updateRecvButtons() {
  for (let i = 1; i <= 4; i++) {
    document.getElementById("recv" + i).classList.toggle("selected", selectedRecv === i - 1);
  }
}

function updateDefense() {
  const carrier = ball.carrier;
  defense.forEach((d, i) => {
    if (carrier && !ball.inAir) {
      d.tx = carrier.x - 8 + (i % 3 - 1) * 12;
      d.ty = carrier.y + (i - 4.5) * 10;
    } else if (ball.inAir) {
      d.tx = ball.x + ball.vx * 6;
      d.ty = ball.y + ball.vy * 6;
    } else {
      d.tx = los + 60 + (i % 3) * 35;
      d.ty = 65 + (i * 35) % (H - 130);
    }
  });
}

function update() {
  if (state !== State.PLAY) return;

  if (playActive) {
    clock -= 1 / 60;
    if (clock <= 0) {
      clock = 0;
      quarter++;
      if (quarter > 4) {
        state = State.OVER;
        document.getElementById("controls").classList.remove("active");
        document.getElementById("scoreBar").style.display = "none";
        const res = document.getElementById("finalResult");
        if (scoreP > scoreB) res.textContent = "YOU WIN!";
        else if (scoreP < scoreB) res.textContent = "BOT WINS";
        else res.textContent = "IT'S A TIE!";
        document.getElementById("finalScore").textContent = `Final  ${scoreP} - ${scoreB}`;
        document.getElementById("gameOverOverlay").classList.remove("hidden");
        return;
      }
      clock = 5 * 60;
      switchPoss();
      setupPlay();
      showMessage(`QUARTER ${quarter}`);
    }
  }

  if (messageTimer > 0) {
    messageTimer--;
    if (messageTimer <= 0) document.getElementById("messageBox").classList.add("hidden");
  }

  if (!playActive) {
    if (possession === "bot") {
      botTimer++;
      if (botTimer > 70) {
        botTimer = 0;
        playActive = true;
        receivers.forEach(wr => {
          if (wr.route.length) { wr.tx = wr.route[0].x; wr.ty = wr.route[0].y; wr.ri = 1; }
        });
      }
    }
    updateHUD();
    return;
  }

  if (possession === "player" && ball.carrier) {
    const c = ball.carrier;
    if (joyActive && (Math.abs(joyDX) > 0.12 || Math.abs(joyDY) > 0.12)) {
      c.tx = c.x + joyDX * 40;
      c.ty = c.y + joyDY * 40;
    } else if (c !== qb) {
      c.tx = c.x + 25;
      c.ty = c.y;
    }
  }

  if (possession === "bot" && ball.carrier) {
    const c = ball.carrier;
    if (c === qb && !ball.inAir) {
      botTimer++;
      if (botTimer > 55) {
        botTimer = 0;
        if (Math.random() < 0.55 && receivers.length) {
          const t = receivers[Math.floor(Math.random() * receivers.length)];
          ball.throwTo(qb.x, qb.y, t.x + 15, t.y, 5.2);
          qb.hasBall = false; ball.carrier = null;
        } else if (runners.length && Math.random() < 0.45) {
          const rb = runners[0];
          qb.hasBall = false; rb.hasBall = true; ball.carrier = rb;
          rb.tx = W - 55; rb.ty = H / 2 + (Math.random() - 0.5) * 70;
        } else {
          qb.tx = qb.x + 55; qb.ty = H / 2 + (Math.random() - 0.5) * 50;
        }
      }
    } else {
      c.tx = W - 45; c.ty = H / 2 + (Math.random() - 0.5) * 35;
    }
  }

  qb.update();
  receivers.forEach(p => p.update());
  runners.forEach(p => p.update());
  defense.forEach(p => p.update());
  updateDefense();

  const res = ball.update();
  if (res === "incomplete") endPlay("INCOMPLETE", 0);

  if (ball.inAir) {
    [...receivers, ...runners].forEach(wr => {
      if (Math.hypot(ball.x - wr.x, ball.y - wr.y) < wr.r + 12) {
        ball.inAir = false; ball.carrier = wr; wr.hasBall = true; qb.hasBall = false;
      }
    });
  }

  if (ball.carrier && !ball.inAir) {
    const c = ball.carrier;
    for (const d of defense) {
      if (d.cd > 0) continue;
      if (Math.hypot(c.x - d.x, c.y - d.y) < c.r + d.r + 2) {
        d.cd = 40;
        if (Math.random() < 0.28 && (c.role === "RB" || c.role === "WR")) {
          c.stunned = 10; continue;
        }
        c.stunned = 18;
        const yards = Math.floor((c.x - los) / 5.5);
        endPlay(`TACKLED  ${Math.max(0, yards)} YDS`, Math.max(0, yards));
        return;
      }
    }
  }

  if (ball.carrier) {
    if (ball.carrier.x > W - 48) { scoreTD(); return; }
    if (ball.carrier.y < 48 || ball.carrier.y > H - 48) {
      const yards = Math.floor((ball.carrier.x - los) / 5.5);
      endPlay(`OUT OF BOUNDS  ${Math.max(0, yards)} YDS`, Math.max(0, yards));
      return;
    }
  }

  updateHUD();
}

function drawField() {
  ctx.fillStyle = "#2d8f2d";
  ctx.fillRect(0, 0, W, H);

  const stripeW = (W - 100) / 20;
  for (let i = 0; i < 20; i++) {
    if (i % 2 === 0) {
      ctx.fillStyle = "#278027";
      ctx.fillRect(50 + i * stripeW, 42, stripeW, H - 84);
    }
  }

  ctx.strokeStyle = "rgba(255,255,255,0.75)";
  ctx.lineWidth = 2;
  for (let i = 0; i <= 10; i++) {
    const x = 50 + i * ((W - 100) / 10);
    ctx.beginPath();
    ctx.moveTo(x, 42);
    ctx.lineTo(x, H - 42);
    ctx.stroke();
    if (i > 0 && i < 10) {
      ctx.fillStyle = "rgba(255,255,255,0.9)";
      ctx.font = "bold 12px Courier New";
      ctx.textAlign = "center";
      ctx.fillText(String(i * 10), x, 58);
      ctx.fillText(String(i * 10), x, H - 48);
    }
  }

  ctx.strokeStyle = "rgba(255,255,255,0.4)";
  ctx.lineWidth = 1;
  for (let i = 0; i < 100; i++) {
    const x = 50 + i * ((W - 100) / 100);
    ctx.beginPath();
    ctx.moveTo(x, H / 2 - 12);
    ctx.lineTo(x, H / 2 - 5);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(x, H / 2 + 5);
    ctx.lineTo(x, H / 2 + 12);
    ctx.stroke();
  }

  ctx.fillStyle = "#1e3a8a";
  ctx.fillRect(0, 42, 50, H - 84);
  ctx.fillStyle = "#9b1c1c";
  ctx.fillRect(W - 50, 42, 50, H - 84);

  ctx.strokeStyle = "rgba(255,255,255,0.12)";
  ctx.lineWidth = 6;
  for (let i = -2; i < 8; i++) {
    ctx.beginPath();
    ctx.moveTo(0, 42 + i * 28);
    ctx.lineTo(50, 70 + i * 28);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(W - 50, 42 + i * 28);
    ctx.lineTo(W, 70 + i * 28);
    ctx.stroke();
  }

  ctx.fillStyle = "rgba(255,255,255,0.85)";
  ctx.font = "bold 11px Courier New";
  ctx.textAlign = "center";
  ctx.save();
  ctx.translate(25, H / 2);
  ctx.rotate(-Math.PI / 2);
  ctx.fillText("END ZONE", 0, 0);
  ctx.restore();
  ctx.save();
  ctx.translate(W - 25, H / 2);
  ctx.rotate(Math.PI / 2);
  ctx.fillText("END ZONE", 0, 0);
  ctx.restore();

  ctx.strokeStyle = "#fbbf24";
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(los, 42);
  ctx.lineTo(los, H - 42);
  ctx.stroke();

  ctx.strokeStyle = "#60a5fa";
  ctx.lineWidth = 2.5;
  ctx.setLineDash([6, 4]);
  ctx.beginPath();
  ctx.moveTo(firstDownX, 42);
  ctx.lineTo(firstDownX, H - 42);
  ctx.stroke();
  ctx.setLineDash([]);

  ctx.strokeStyle = "#fff";
  ctx.lineWidth = 3;
  ctx.strokeRect(0, 42, W, H - 84);
}

function draw() {
  if (state === State.PLAY || state === State.RESULT) {
    drawField();
    defense.forEach(p => p.draw());
    runners.forEach(p => p.draw());
    receivers.forEach((p, i) => {
      p.draw();
      if (i === selectedRecv && possession === "player" && playActive) {
        ctx.beginPath();
        ctx.arc(Math.round(p.x), Math.round(p.y), p.r + 6, 0, Math.PI * 2);
        ctx.strokeStyle = "#ffd700";
        ctx.lineWidth = 2.5;
        ctx.stroke();
      }
    });
    if (qb) qb.draw();
    if (ball) ball.draw();
  }
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

const joyZone = document.getElementById("joystickZone");
const joyKnob = document.getElementById("joystickKnob");
const joyBase = document.getElementById("joystickBase");

function joyStart(e) {
  e.preventDefault();
  joyActive = true;
  const t = e.touches ? e.touches[0] : e;
  const rect = joyBase.getBoundingClientRect();
  joyOrigin.x = rect.left + rect.width / 2;
  joyOrigin.y = rect.top + rect.height / 2;
  joyMove(e);
}
function joyMove(e) {
  if (!joyActive) return;
  e.preventDefault();
  const t = e.touches ? e.touches[0] : e;
  let dx = t.clientX - joyOrigin.x;
  let dy = t.clientY - joyOrigin.y;
  const max = 30;
  const mag = Math.hypot(dx, dy);
  if (mag > max) { dx = dx / mag * max; dy = dy / mag * max; }
  joyDX = dx / max;
  joyDY = dy / max;
  joyKnob.style.left = (28 + dx) + "px";
  joyKnob.style.top = (28 + dy) + "px";
}
function joyEnd() {
  joyActive = false; joyDX = 0; joyDY = 0;
  joyKnob.style.left = "28px"; joyKnob.style.top = "28px";
}

joyZone.addEventListener("touchstart", joyStart, {passive:false});
joyZone.addEventListener("touchmove", joyMove, {passive:false});
joyZone.addEventListener("touchend", joyEnd);
joyZone.addEventListener("mousedown", joyStart);
window.addEventListener("mousemove", e => { if (joyActive) joyMove(e); });
window.addEventListener("mouseup", joyEnd);

document.getElementById("btnSnap").addEventListener("click", () => {
  if (state === State.PLAY && !playActive && possession === "player") snap();
});
document.getElementById("btnThrow").addEventListener("click", () => {
  if (state !== State.PLAY || !playActive || possession !== "player") return;
  if (ball.carrier === qb && !ball.inAir && receivers[selectedRecv]) {
    const t = receivers[selectedRecv];
    const leadX = t.x + (t.tx - t.x) * 0.2;
    const leadY = t.y + (t.ty - t.y) * 0.2;
    ball.throwTo(qb.x, qb.y, leadX, leadY, 5.5);
    qb.hasBall = false; ball.carrier = null;
  }
});
document.getElementById("btnHandoff").addEventListener("click", () => {
  if (state !== State.PLAY || !playActive || possession !== "player") return;
  if (ball.carrier === qb && runners[0]) {
    const rb = runners[0];
    if (Math.hypot(qb.x - rb.x, qb.y - rb.y) < 65) {
      qb.hasBall = false; rb.hasBall = true; ball.carrier = rb;
      rb.tx = W - 70; rb.ty = rb.y + (Math.random() - 0.5) * 40;
    }
  }
});

for (let i = 1; i <= 4; i++) {
  document.getElementById("recv" + i).addEventListener("click", () => {
    selectedRecv = i - 1;
    updateRecvButtons();
  });
}

document.getElementById("btnStart").addEventListener("click", () => {
  document.getElementById("menuOverlay").classList.add("hidden");
  document.getElementById("teamOverlay").classList.remove("hidden");
  const grid = document.getElementById("teamGrid");
  grid.innerHTML = "";
  selectedTeamIdx = -1;
  document.getElementById("btnConfirmTeam").style.display = "none";

  NFL_TEAMS.forEach((t, i) => {
    const card = document.createElement("div");
    card.className = "team-card";
    card.style.background = t.color;
    card.innerHTML = `<span class="abbr">${t.abbr}</span><span class="name">${t.name}</span>`;

    const pick = (e) => {
      e.preventDefault();
      e.stopPropagation();
      document.querySelectorAll(".team-card").forEach(c => c.classList.remove("selected"));
      card.classList.add("selected");
      selectedTeamIdx = i;
      // Start immediately on second tap of same team, or show confirm
      document.getElementById("btnConfirmTeam").style.display = "block";
      // Auto-scroll confirm into view
      document.getElementById("btnConfirmTeam").scrollIntoView({ behavior: "smooth", block: "nearest" });
    };

    card.addEventListener("click", pick);
    card.addEventListener("touchend", (e) => {
      // Prevent ghost click + handle touch cleanly
      e.preventDefault();
      pick(e);
    }, { passive: false });

    grid.appendChild(card);
  });
});

document.getElementById("btnConfirmTeam").addEventListener("click", () => {
  if (selectedTeamIdx >= 0) startGame(selectedTeamIdx);
});
document.getElementById("btnConfirmTeam").addEventListener("touchend", (e) => {
  e.preventDefault();
  if (selectedTeamIdx >= 0) startGame(selectedTeamIdx);
}, { passive: false });

document.getElementById("btnContinue").addEventListener("click", () => {
  document.getElementById("resultOverlay").classList.add("hidden");
  state = State.PLAY;
  setupPlay();
  updateHUD();
});

document.getElementById("btnMenu").addEventListener("click", () => {
  document.getElementById("gameOverOverlay").classList.add("hidden");
  document.getElementById("menuOverlay").classList.remove("hidden");
  state = State.MENU;
});

document.addEventListener("touchmove", e => {
  if (e.target.closest("#controls") || e.target === canvas) e.preventDefault();
}, {passive:false});
</script>
