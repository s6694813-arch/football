<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Retro Football: You vs CPU</title><link rel="stylesheet" href="style.css"></head><body><main>
<header><div class="logo">🏈 RETRO FOOTBALL</div><div id="status">VS CPU</div></header>
<section class="score"><div class="red">YOUR TEAM <b id="s0">0</b></div><div class="quarter">YOU VS CPU</div><div class="blue">CPU <b id="s1">0</b></div></section>
<canvas id="field" width="900" height="500" aria-label="Football game field"></canvas>
<div id="message">Loading game...</div>
<div class="instructions">MOVE: A / D or ← / → &nbsp; • &nbsp; JUMP: W / ↑ &nbsp; • &nbsp; PASS: TAP A TEAMMATE WHEN THEY ARE OPEN</div>
<div class="touch"><div><button data-k="left">◀ LEFT</button><button data-k="right">RIGHT ▶</button></div><div><button data-k="jump">JUMP</button></div></div>
<p class="foot">Green-ring teammates are open. Tap one at the right moment for a catch!</p>
</main><script src="client.js"></script></body></html>
