<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Retro Football 1v1</title><link rel="stylesheet" href="style.css"></head><body><main>
<header><div class="logo">🏈 RETRO FOOTBALL</div><div id="status">CONNECTING...</div></header>
<section class="score"><div class="red">RED <b id="s0">0</b></div><div class="quarter">1 VS 1 • LIVE</div><div class="blue">BLUE <b id="s1">0</b></div></section>
<canvas id="field" width="900" height="500"></canvas>
<div id="message">Loading game...</div>
<div class="instructions">MOVE: A / D or ← / → &nbsp; • &nbsp; JUMP: W / ↑ &nbsp; • &nbsp; PASS: SPACE</div>
<div class="touch">
  <div><button data-k="left">◀</button><button data-k="right">▶</button></div>
  <div><button data-k="jump">JUMP</button><button data-k="pass">PASS</button></div>
</div>
<p class="foot">Share the hosted website address with one friend. First two players to join enter the match.</p>
</main><script src="client.js"></script></body></html>
